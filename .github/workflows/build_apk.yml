name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Kagua mafaili na Get dependencies
        working-directory: ./pharmacy_pos
        run: |
          pwd
          ls -la
          ls -la lib/
          flutter pub get

      - name: Build Android APK
        working-directory: ./pharmacy_pos
        run: flutter build apk --release --target=lib/main.dart

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-pos-apk
          path: pharmacy_pos/build/app/outputs/flutter-apk/app-release.apk
